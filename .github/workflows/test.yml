name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The range the package declares support for in "engines".
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

      # The bin file must stay executable, or the installed command fails with
      # "permission denied" rather than anything that points at packaging.
      - name: Check the bin file is executable
        run: test -x src/index.js
